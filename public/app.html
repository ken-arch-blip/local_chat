<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Huddle</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<!-- ================================================================ auth -->
<div id="auth">
  <div class="auth-card">
    <div class="auth-brand"><span class="mark">H</span> Huddle</div>
    <h1 id="auth-title">Welcome back</h1>
    <p id="auth-sub">Sign in to get back to your people.</p>

    <div class="auth-err" id="auth-err"></div>

    <form id="auth-form" autocomplete="on">
      <label for="f-username">Username</label>
      <input id="f-username" name="username" autocomplete="username" maxlength="20" placeholder="mina" required>

      <div class="field-display">
        <label for="f-display">Display name</label>
        <input id="f-display" name="display_name" autocomplete="nickname" maxlength="32" placeholder="Mina">
      </div>

      <label for="f-password">Password</label>
      <input id="f-password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>

      <button type="submit" id="auth-submit">Sign in</button>
    </form>

    <p class="auth-swap">
      <span id="auth-swap-text">New here?</span>
      <button type="button" id="auth-swap">Create an account</button>
    </p>
    <a class="auth-home" href="/">← Back to the homepage</a>
  </div>
</div>

<!-- ================================================================= app -->
<div id="app" hidden>

  <!-- server rail -->
  <nav id="rail" aria-label="Servers">
    <button class="rail-btn home" id="rail-dms" title="Direct messages" aria-label="Direct messages">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 3C7 3 3 6.6 3 11c0 2.3 1.1 4.4 2.9 5.8-.1 1-.6 2.3-1.7 3.4 0 0 2.7-.2 4.7-1.8 1 .3 2 .5 3.1.5 5 0 9-3.6 9-8s-4-8-9-8z"/></svg>
    </button>
    <div class="rail-sep"></div>
    <div id="rail-servers"></div>
    <button class="rail-btn add" id="rail-add" title="Add a server" aria-label="Add a server">+</button>
  </nav>

  <!-- sidebar -->
  <aside id="sidebar">
    <header id="sidebar-header">
      <span id="sidebar-title">Direct messages</span>
      <button id="server-menu-btn" class="icon-btn" title="Server options" hidden aria-label="Server options">⌄</button>
    </header>

    <div id="sidebar-body">
      <div id="channel-list"></div>
    </div>

    <div id="voice-status" hidden>
      <div class="vs-top">
        <span class="vs-dot"></span>
        <div class="vs-info">
          <div class="vs-title">Voice connected</div>
          <div class="vs-ch" id="vs-channel"></div>
        </div>
        <button class="icon-btn danger" id="vs-leave" title="Disconnect" aria-label="Disconnect from voice">⏻</button>
      </div>
      <div class="vs-controls">
        <button id="btn-mute" class="vs-btn" aria-pressed="false">Mute</button>
        <button id="btn-deafen" class="vs-btn" aria-pressed="false">Deafen</button>
      </div>
    </div>

    <div id="user-panel">
      <div class="avatar" id="my-avatar"></div>
      <div class="up-text">
        <div class="up-name" id="my-name"></div>
        <div class="up-status" id="my-status">Online</div>
      </div>
      <button class="icon-btn" id="btn-settings" title="Settings" aria-label="User settings">⚙</button>
    </div>
  </aside>

  <!-- main -->
  <main id="main">
    <header id="chat-header">
      <button class="icon-btn only-mobile" id="btn-back" aria-label="Back to channels">‹</button>
      <span id="header-icon">#</span>
      <span id="header-title">general</span>
      <div class="spacer"></div>
      <button class="icon-btn only-mobile" id="btn-members-toggle" aria-label="Toggle member list">☰</button>
    </header>

    <div id="messages" role="log" aria-live="polite"></div>

    <div id="typing-row"><span id="typing-text"></span></div>

    <div id="composer">
      <div id="reply-bar" hidden>
        <span>Replying to <b id="reply-to-name"></b></span>
        <button class="icon-btn" id="reply-cancel" aria-label="Cancel reply">✕</button>
      </div>
      <form id="msg-form">
        <textarea id="msg-input" rows="1" maxlength="2000" placeholder="Message" aria-label="Message"></textarea>
        <button type="submit" id="send-btn" aria-label="Send message">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        </button>
      </form>
    </div>
  </main>

  <!-- members -->
  <aside id="members">
    <div id="members-body"></div>
  </aside>
</div>

<!-- ============================================================== modals -->
<div class="modal-root" id="modal-root" hidden>
  <div class="modal-scrim" data-close></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header>
      <h2 id="modal-title"></h2>
      <button class="icon-btn" data-close aria-label="Close">✕</button>
    </header>
    <div id="modal-body"></div>
  </div>
</div>

<div id="ctx-menu" hidden role="menu"></div>
<div id="toast-root" aria-live="polite"></div>
<div id="voice-audio" hidden></div>

<script src="/js/app.js"></script>
</body>
</html>
